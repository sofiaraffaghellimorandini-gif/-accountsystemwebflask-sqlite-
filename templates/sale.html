<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale Form</title>
    <link rel="stylesheet" href="https://unpkg.com/spectre.css">
    <link rel="stylesheet" href="https://unpkg.com/spectre.expanded.css">
    <style>
        body {
            padding: 20px;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        
        .navbar {
            background-color: #3498db;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .navbar-brand {
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            color: white;
        }
        
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        .form-title {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
            font-size: 24px;
            font-weight: bold;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        
        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52,152,219,0.2);
        }
        
        .button-container {
            text-align: center;
            margin-top: 25px;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 25px;
            margin: 5px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background-color: #2980b9;
            color: white;
            border: none;
            cursor: pointer;
        }
        
        .btn-primary:hover {
            background-color: #2573a7;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background-color: #95a5a6;
            color: white;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }
        
        .btn-secondary:hover {
            background-color: #7f8c8d;
            transform: translateY(-2px);
        }
        
        .required::after {
            content: " *";
            color: #e74c3c;
        }
        
        .flash-messages {
            max-width: 600px;
            margin: 0 auto 20px;
        }
        
        .flash-success {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            border: 1px solid #c3e6cb;
        }
        
        .flash-error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="{{ url_for('index') }}" class="navbar-brand">Accounting & Warehouse System</a>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="form-container">
        <h2 class="form-title">Sale Form</h2>
        
        <form method="POST" action="{{ url_for('sale') }}">
            <div class="form-group">
                <label class="form-label required" for="product_name">Product Name</label>
                <input type="text" id="product_name" name="product_name" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label class="form-label required" for="unit_price">Unit Price ($)</label>
                <input type="number" id="unit_price" name="unit_price" class="form-input" min="0.01" step="0.01" required>
            </div>
            
            <div class="form-group">
                <label class="form-label required" for="quantity">Number of Pieces</label>
                <input type="number" id="quantity" name="quantity" class="form-input" min="1" required>
            </div>
            
            <div class="button-container">
                <button type="submit" class="btn btn-primary">Submit Sale</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
